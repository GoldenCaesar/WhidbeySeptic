<script>
  const contactForm = document.getElementById('contact-form');
  const siteStreetInput = document.getElementById('site_street');
  const siteCityInput = document.getElementById('site_city');
  const siteStateInput = document.getElementById('site_state');
  const siteZipInput = document.getElementById('site_zip');
  const what3wordsInput = document.getElementById('what3words');

  // Function to format What3Words input
  function formatWhat3Words(input) {
    // Remove any leading slashes and spaces
    let cleaned = input.replace(/^[\/\s]+/, '').toLowerCase();
    
    // Remove any characters that aren't letters, periods, or hyphens
    cleaned = cleaned.replace(/[^a-z.\-]/g, '');
    
    // Limit to 3 words by allowing only 2 periods
    // Split by period, take first 3 parts, then rejoin
    // This preserves periods as users type while preventing a 3rd period
    const parts = cleaned.split('.');
    if (parts.length > 3) {
      // Keep only first 3 parts (separated by 2 periods)
      return parts.slice(0, 3).join('.');
    }
    
    return cleaned;
  }

  // Function to validate What3Words format (3 words separated by periods)
  function validateWhat3Words(input) {
    const w3wPattern = /^[a-z\-]+\.[a-z\-]+\.[a-z\-]+$/;
    return w3wPattern.test(input.trim().toLowerCase());
  }

  // Handle What3Words input formatting
  what3wordsInput.addEventListener('input', function(e) {
    const cursorPosition = e.target.selectionStart;
    const oldValue = e.target.value;
    const formatted = formatWhat3Words(oldValue);
    
    if (oldValue !== formatted) {
      e.target.value = formatted;
      
      // Try to maintain cursor position
      const diff = formatted.length - oldValue.length;
      const newPosition = cursorPosition + diff;
      e.target.setSelectionRange(newPosition, newPosition);
    }
    
    updateRequiredFields();
  });

  // Handle state input formatting (auto-uppercase)
  siteStateInput.addEventListener('input', function(e) {
    e.target.value = e.target.value.toUpperCase();
  });

  // Function to check if site address fields have any values
  function hasSiteAddressValue() {
    return siteStreetInput.value.trim() || 
           siteCityInput.value.trim() || 
           siteStateInput.value.trim() || 
           siteZipInput.value.trim();
  }

  // Function to update required states based on input
  function updateRequiredFields() {
    const hasSiteAddress = hasSiteAddressValue();
    const hasWhat3words = what3wordsInput.value.trim();

    // If either address type has any value, make that type's fields required
    // and the other type's fields optional
    if (hasSiteAddress) {
      // Site address has values, make all site address fields required
      siteStreetInput.setAttribute('required', '');
      siteCityInput.setAttribute('required', '');
      siteStateInput.setAttribute('required', '');
      siteZipInput.setAttribute('required', '');
      what3wordsInput.removeAttribute('required');
    } else if (hasWhat3words) {
      // What3Words has value, make site address fields optional
      siteStreetInput.removeAttribute('required');
      siteCityInput.removeAttribute('required');
      siteStateInput.removeAttribute('required');
      siteZipInput.removeAttribute('required');
      what3wordsInput.setAttribute('required', '');
    } else {
      // Both are empty, make all site address fields required (default)
      siteStreetInput.setAttribute('required', '');
      siteCityInput.setAttribute('required', '');
      siteStateInput.setAttribute('required', '');
      siteZipInput.setAttribute('required', '');
      what3wordsInput.setAttribute('required', '');
    }
  }

  // Add input event listeners to all address fields
  siteStreetInput.addEventListener('input', updateRequiredFields);
  siteCityInput.addEventListener('input', updateRequiredFields);
  siteStateInput.addEventListener('input', updateRequiredFields);
  siteZipInput.addEventListener('input', updateRequiredFields);

  contactForm.addEventListener('submit', function(event) {
    event.preventDefault(); // Prevent default form submission

    const name = contactForm.elements['name'].value;
    const siteStreet = contactForm.elements['site_street'].value.trim();
    const siteCity = contactForm.elements['site_city'].value.trim();
    const siteState = contactForm.elements['site_state'].value.trim();
    const siteZip = contactForm.elements['site_zip'].value.trim();
    const what3words = contactForm.elements['what3words'].value.trim();
    const email = contactForm.elements['email'].value;
    const phone = contactForm.elements['phone'].value;
    const message = contactForm.elements['message'].value;

    // Check if we have site address components
    const hasSiteAddress = siteStreet || siteCity || siteState || siteZip;

    // Validate that at least one address type is filled
    if (!hasSiteAddress && !what3words) {
      alert('Please enter either a Site Address or a What3Words address.');
      return;
    }

    // If site address is started, validate all fields are filled
    if (hasSiteAddress) {
      if (!siteStreet || !siteCity || !siteState || !siteZip) {
        alert('Please complete all Site Address fields (Street, City, State, and Zip Code).');
        return;
      }
      
      // Validate state format (2 letters)
      if (!/^[A-Z]{2}$/.test(siteState)) {
        alert('Please enter a valid 2-letter state code (e.g., WA, CA, NY).');
        siteStateInput.focus();
        return;
      }
      
      // Validate zip code format
      if (!/^\d{5}(-\d{4})?$/.test(siteZip)) {
        alert('Please enter a valid zip code (e.g., 98101 or 98101-1234).');
        siteZipInput.focus();
        return;
      }
    }

    // Validate What3Words format if it's provided
    if (what3words && !validateWhat3Words(what3words)) {
      alert('Please enter a valid What3Words address with exactly 3 words separated by periods (e.g., filled.count.soap)');
      what3wordsInput.focus();
      return;
    }

    // Build the email body
    let addressInfo = '';
    if (hasSiteAddress) {
      const fullAddress = `${siteStreet}, ${siteCity}, ${siteState} ${siteZip}`;
      addressInfo += `Site Address: ${fullAddress}\n`;
    }
    if (what3words) {
      // Convert What3Words to clickable link
      const w3wLink = `https://w3w.co/${what3words}`;
      addressInfo += `What3Words: ${w3wLink}\n`;
    }

    const mailtoLink = `mailto:WhidbeySepticLLC@gmail.com` +
                       `?subject=${encodeURIComponent('Contact Form Submission from ' + name)}` +
                       `&body=${encodeURIComponent(
                         `Name: ${name}\n` +
                         addressInfo +
                         `Email: ${email}\n` +
                         `Phone: ${phone}\n\n` +
                         `Message:\n${message}`
                       )}`;

    // Attempt to open mail client
    window.location.href = mailtoLink;
  });
</script>
